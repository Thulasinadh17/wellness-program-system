{% extends 'base.html' %}

{% block title %}500 Server Error - Wellness Hub{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card-wellness p-5">
        <i class="bi bi-exclamation-triangle-fill text-warning mb-3" style="font-size: 4rem;"></i>
        <h2 class="fw-bold mb-2">500 Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again shortly.</p>
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard_redirect' %}" class="btn btn-teal">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        {% else %}
          <a href="{% url 'home' %}" class="btn btn-teal">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
