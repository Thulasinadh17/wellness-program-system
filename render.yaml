services:
  - type: web
    name: wellness-system
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "gunicorn wellness_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wellness-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

databases:
  - name: wellness-postgres
    plan: free
    region: oregon
